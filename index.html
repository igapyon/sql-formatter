<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL Formatter (WIP)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #f6f2ea;
      --bg-2: #efe7db;
      --ink: #1b1b1b;
    }
    html, body { height: 100%; }
    body { font-family: "Space Grotesk", system-ui, sans-serif; color: var(--ink); }
    .paper {
      background: linear-gradient(120deg, var(--bg-1), var(--bg-2));
    }
    .grid {
      background-image:
        linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="paper grid">
  <div class="min-h-screen px-6 py-10">
    <div class="mx-auto max-w-5xl">
      <header class="mb-8">
        <h1 class="text-3xl md:text-5xl font-bold tracking-tight">SQL Formatter (WIP)</h1>
        <p class="mt-2 text-base md:text-lg text-slate-700">
          ここは SQL Formatter の UI を実装予定のページです。現在はプレースホルダー。
        </p>
      </header>

      <div class="grid gap-6 md:grid-cols-[1fr_1fr]">
        <section class="rounded-2xl bg-white/80 backdrop-blur p-4 shadow-lg">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold">SQL Input</h2>
            <button disabled class="rounded-full bg-slate-300 px-4 py-2 text-sm font-semibold text-slate-700">Format</button>
          </div>
          <textarea class="mt-3 h-64 w-full resize-none rounded-xl border border-slate-200 bg-white p-3 text-sm leading-6 outline-none" spellcheck="false" placeholder="SQL を入力してください（Formatter は未実装）"></textarea>
        </section>

        <section class="rounded-2xl bg-white/80 backdrop-blur p-4 shadow-lg">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold">Formatted Output</h2>
            <span class="text-xs text-slate-500">WIP</span>
          </div>
          <pre class="mt-3 h-64 overflow-auto rounded-xl border border-slate-200 bg-slate-900 p-3 text-xs leading-5 text-slate-100">// coming soon</pre>
        </section>
      </div>

      <footer class="mt-8 text-xs text-slate-600">
        <p>AST デモは <code>index-parser.html</code> を参照してください。</p>
      </footer>
    </div>
  </div>
</body>
</html>
