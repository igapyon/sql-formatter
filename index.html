<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL Formatter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #f6f2ea;
      --bg-2: #efe7db;
      --ink: #1b1b1b;
    }
    html, body { height: 100%; }
    body { font-family: "Space Grotesk", system-ui, sans-serif; color: var(--ink); }
    .paper {
      background: linear-gradient(120deg, var(--bg-1), var(--bg-2));
    }
    .grid {
      background-image:
        linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="paper grid">
  <div class="min-h-screen px-6 py-10">
    <div class="mx-auto max-w-5xl">
      <header class="mb-8">
        <h1 class="text-3xl md:text-5xl font-bold tracking-tight">SQL Formatter</h1>
        <p class="mt-2 text-base md:text-lg text-slate-700">
          ここは SQL Formatter の UI です。現在は開発中です。
        </p>
      </header>

      <div class="grid gap-6 md:grid-cols-[1fr_1fr]">
        <section class="rounded-2xl bg-white/80 backdrop-blur p-4 shadow-lg">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold">SQL Input</h2>
            <div class="flex items-center gap-2">
              <button id="parseBtn" class="rounded-full bg-teal-700 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-800">Parse → AST</button>
              <button id="formatBtn" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Format</button>
            </div>
          </div>
          <textarea id="sqlInput" class="mt-3 h-64 w-full resize-none rounded-xl border border-slate-200 bg-white p-3 text-sm leading-6 outline-none focus:border-teal-600" spellcheck="false" placeholder="SQL を入力してください（Formatter は未実装）"></textarea>
        </section>

        <section class="rounded-2xl bg-white/80 backdrop-blur p-4 shadow-lg">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold">Formatted Output</h2>
            <div class="flex items-center gap-2">
              <button id="copyBtn" class="rounded-full border border-slate-200 bg-white px-2.5 py-2 text-slate-700 hover:bg-slate-50" aria-label="Copy formatted output" title="Copy">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M9 9h10v10H9z" stroke="currentColor" stroke-width="1.6"/>
                  <path d="M5 15V5h10" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </button>
              <span id="status" class="text-xs text-slate-500">idle</span>
            </div>
          </div>
          <pre id="formatOutput" class="mt-3 h-64 overflow-auto rounded-xl border border-slate-200 bg-slate-900 p-3 text-xs leading-5 text-slate-100">// formatted output will appear here</pre>
        </section>
      </div>

      <footer class="mt-8 text-xs text-slate-600"></footer>
    </div>
  </div>
  <script src="./spec/apache-calcite-Parser.js"></script>
  <script src="./sql-formatter.js"></script>
  <script>
    const input = document.getElementById('sqlInput');
    const output = document.getElementById('formatOutput');
    const status = document.getElementById('status');
    const parseBtn = document.getElementById('parseBtn');
    const formatBtn = document.getElementById('formatBtn');
    const copyBtn = document.getElementById('copyBtn');

    const defaultSql = "SELECT a FROM t WHERE b = 1";
    input.value = defaultSql;

    function render(text) {
      output.textContent = text;
    }

    async function copyOutput() {
      const text = output.textContent || '';
      if (!text.trim()) {
        status.textContent = 'empty';
        return;
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const range = document.createRange();
          range.selectNodeContents(output);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          document.execCommand('copy');
          selection.removeAllRanges();
        }
        status.textContent = 'copied';
      } catch (err) {
        status.textContent = 'copy failed';
      }
    }

    function handleParse() {
      const sql = input.value.trim();
      if (!sql) {
        output.textContent = '';
        status.textContent = 'empty';
        return;
      }
      try {
        const lexer = new window.CalciteLexer(sql);
        const tokens = lexer.tokenize();
        const parser = new window.CalciteParser(tokens);
        const ast = parser.SqlStmtList();
        status.textContent = `ok (pos: ${parser.pos})`;
        render(JSON.stringify(ast, null, 2));
      } catch (err) {
        status.textContent = 'error';
        render(JSON.stringify({ error: String(err.message || err) }, null, 2));
      }
    }

    function handleFormat() {
      const sql = input.value.trim();
      if (!sql) {
        output.textContent = '';
        status.textContent = 'empty';
        return;
      }
      try {
        if (typeof window.formatSql !== 'function') {
          status.textContent = 'error';
          render('formatter not loaded');
          return;
        }
        const formatted = window.formatSql(sql);
        status.textContent = 'ok';
        render(formatted);
      } catch (err) {
        status.textContent = 'error';
        render(String(err.message || err));
      }
    }

    parseBtn.addEventListener('click', handleParse);
    formatBtn.addEventListener('click', handleFormat);
    copyBtn.addEventListener('click', copyOutput);
    input.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') handleParse();
    });

    handleParse();

  </script>
</body>
</html>
