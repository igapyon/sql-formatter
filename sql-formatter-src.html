<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL Formatter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { height: 100%; }
    body { font-family: "Spline Sans", system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="min-h-screen px-4 py-10">
    <div class="mx-auto max-w-2xl">
      <header class="mb-6 flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">SQL Formatter</h1>
          <p class="mt-2 text-sm text-gray-600">
            DML/DQL（SELECT, INSERT, UPDATE, DELETE）と DDL（CREATE TABLE, ALTER TABLE など）のフォーマットに対応しています。
          </p>
        </div>
      </header>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-md">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-sm font-semibold text-gray-700">SQL Input</h2>
            <div class="flex flex-wrap items-center gap-2">
              <button id="parseBtn" class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white transition-colors hover:bg-blue-700">Parse → AST</button>
              <button id="formatBtn" class="rounded-lg bg-green-600 px-3 py-1.5 text-xs font-semibold text-white transition-colors hover:bg-green-700">Format</button>
            </div>
          </div>
          <textarea id="sqlInput" class="mt-3 h-80 w-full resize-none rounded-lg border border-gray-200 bg-white p-3 text-sm leading-6 outline-none transition-colors focus:border-gray-400 focus:ring-2 focus:ring-green-200" spellcheck="false" placeholder="SQL を入力してください"></textarea>
        </section>

        <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-md">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-sm font-semibold text-gray-700">Formatted Output</h2>
            <div class="flex items-center gap-2">
              <button id="copyBtn" class="rounded-lg border border-gray-200 bg-white px-2.5 py-1.5 text-xs text-gray-700 transition-colors hover:bg-gray-100" aria-label="Copy formatted output" title="Copy">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M9 9h10v10H9z" stroke="currentColor" stroke-width="1.6"/>
                  <path d="M5 15V5h10" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </button>
              <span id="status" class="text-xs text-gray-500">idle</span>
            </div>
          </div>
          <pre id="formatOutput" class="mt-3 h-80 overflow-auto rounded-lg border border-dashed border-gray-300 bg-gray-50 p-3 text-xs leading-5 text-gray-800 font-mono">// formatted output will appear here</pre>
        </section>
      </div>

      <hr class="mt-10 border-gray-200" />
      <footer class="mt-4 flex flex-wrap items-center gap-4 text-xs text-gray-600">
        <a href="https://github.com/igapyon/sql-formatter" class="inline-flex items-center gap-2 text-blue-600 transition-colors hover:text-blue-800 underline" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 16 16" class="h-4 w-4" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
          </svg>
          <span>GitHub</span>
        </a>
        <a href="./LICENSE" class="inline-flex items-center gap-2 text-blue-600 transition-colors hover:text-blue-800 underline" target="_blank" rel="noopener noreferrer">
          <span class="inline-flex items-center justify-center rounded-full border border-gray-200 bg-gray-100 px-2 py-0.5 text-xs font-semibold transition-colors hover:bg-gray-200">License</span>
        </a>
        <a href="https://igapyon.github.io/sql-formatter/" class="inline-flex items-center gap-2 text-blue-600 transition-colors hover:text-blue-800 underline" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18"/>
            <path d="M12 3a14 14 0 0 1 0 18"/>
            <path d="M12 3a14 14 0 0 0 0 18"/>
          </svg>
          <span>GitHub Pages</span>
        </a>
      </footer>
    </div>
  </div>
  {{CALCITE_PARSER_SCRIPT}}
  {{DDL_PARSER_SCRIPT}}
  {{FORMATTER_SCRIPT}}
  {{APP_SCRIPT}}
</body>
</html>
